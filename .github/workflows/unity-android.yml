name: Unity Android CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.62f3
  BUILD_DIR: Builds

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Setup Android Keystore
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > ${{ env.BUILD_DIR }}/keystore.jks

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildsPath: ${{ env.BUILD_DIR }}/apk
          buildName: WRP-Demo
          androidExportType: androidPackage
          androidKeystoreName: ${{ env.BUILD_DIR }}/keystore.jks
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}
          customParameters: -nographics

      - name: Build AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildsPath: ${{ env.BUILD_DIR }}/aab
          buildName: WRP-Demo
          androidExportType: androidAppBundle
          androidKeystoreName: ${{ env.BUILD_DIR }}/keystore.jks
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          android