name: Unity Android CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.62f3
  BUILD_DIR: Builds

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Setup Android Keystore
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > ${{ env.BUILD_DIR }}/keystore.jks

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildsPath: ${{ env.BUILD_DIR }}/apk
          buildName: WRP-Demo
          androidExportType: androidPackage
          androidKeystoreName: ${{ env.BUILD_DIR }}/keystore.jks
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}
          customParameters: -nographics
          allowDirtyBuild: true

      - name: Build AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildsPath: ${{ env.BUILD_DIR }}/aab
          buildName: WRP-Demo
          androidExportType: androidAppBundle
          androidKeystoreName: ${{ env.BUILD_DIR }}/keystore.jks
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}
          customParameters: -nographics
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-${{ github.sha }}
          path: ${{ env.BUILD_DIR }}/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB-${{ github.sha }}
          path: ${{ env.BUILD_DIR }}/aab/**/*.aab
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup Keystore
        if: always()
        run: rm -f ${{ env.BUILD_DIR }}/keystore.jks

  notify-slack:
    runs-on: ubuntu-latest
    needs: build-android
    if: always()

    steps:
      - name: Set Build Status
        id: status
        run: |
          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "icon=SUCCESS" >> $GITHUB_OUTPUT
            echo "color=#36a64f" >> $GITHUB_OUTPUT
            echo "text=Build Passed" >> $GITHUB_OUTPUT
          else
            echo "icon=FAILED" >> $GITHUB_OUTPUT
            echo "color=#ff0000" >> $GITHUB_OUTPUT
            echo "text=Build Failed" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "attachments": [{
                "color": "${{ steps.status.outputs.color }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${{ steps.status.outputs.icon }} Unity Android Build - ${{ steps.status.outputs.text }}"
                    }
                  },
                 {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
"text": "*Repository:* `${{ github.repository }}`  |  *Branch:* `${{ github.ref_name }}`  |  *Commit:* `${{ github.sha }}`  |  *Triggered by:* `${{ github.actor }}`"                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Artifacts:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Download APK & AAB>"
                    }
                  }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
